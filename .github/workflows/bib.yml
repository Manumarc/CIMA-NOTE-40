name: Render bibliografía
on:
  push:
    paths: ['references.bib', 'README.in.md', 'apa.csl']
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - run: pandoc README.in.md --citeproc -t gfm -o README.md
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "Actualizar bibliografía (APA)"
          git push
